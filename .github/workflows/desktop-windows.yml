# Build Windows desktop installer on tag or manual dispatch.
# Produces NSIS .exe artifact for laptop validation.

name: Desktop (Windows)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'packages/m2pdf-core/**'
      - '.github/workflows/desktop-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop renderer
        run: npm run build -w markdown2pdf-desktop

      - name: Package Windows installer
        run: npm run pack -w markdown2pdf-desktop

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: markdown2pdf-desktop-windows
          path: apps/desktop/release/*.exe
          retention-days: 30
